name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux git

      - name: Run syntax lint and E2E test suite
        run: make test
