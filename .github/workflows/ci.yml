name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux git jq shellcheck python3

      - name: Lint (bash -n, shellcheck, py_compile)
        run: make lint

      - name: Test suite (isolated tmux server)
        run: bash tests/test_prama_agent.sh
